    sdk: flutter
  # 테스트에서 /ws/elder 채널을 흉내 냅니다.
  stream_channel: ^2.1.2
  web_socket_channel: ^3.0.3
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
